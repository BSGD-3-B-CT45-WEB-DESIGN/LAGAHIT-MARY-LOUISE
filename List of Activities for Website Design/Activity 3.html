<!DOCTYPE html>
<html>
<head>
    <title>Hovers, Transitions, Shadows</title>

    <style>

        button{
            box-sizing: border-box;
            transition: all 0.5s ease;
        }

        .uberbutton {
            background-color: #000000;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
        } 

        .uberbutton:hover {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
        }

        .amazonbutton {
            background-color: rgb(255, 216, 20);
            border: none;
            color: rgb(0, 0, 0);
            padding: 15px 32px;
            text-align: center;
            font-size: 16px;
            width: 200px;
            margin: 4px 2px;
            border-radius: 49px;
            cursor: pointer;
        }

        .amazonbutton:hover {
            background-color: rgb(207, 178, 31);
            color: rgb(0, 0, 0);
        }

        .githubbutton {
            background-color: rgb(46, 164, 79);
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            font-size: 16px;
            margin: 4px 2px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .githubbutton:hover {
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.3);
        }

        .bootstrapbutton {
            background-color: rgb(121, 82, 179);
            border: none;
            color: rgb(255, 255, 255);
            padding: 15px 32px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            margin: 4px 2px;
            border-radius: 8px;
            cursor: pointer;
        } 

        .bootstrapbutton:hover {
            background-color: rgb(75, 44, 124);
            color: rgb(255, 255, 255);
        }

        .bootstrap2button {
            background-color: rgb(255, 255, 255);
            border: 1px solid rgb(108, 117, 125);
            color: rgb(108, 117, 125);
            padding: 15px 32px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            margin: 4px 2px;
            border-radius: 8px;
            cursor: pointer;
        } 

        .bootstrap2button:hover {
            background-color: rgb(108, 117, 125);
            border: 1px solid rgb(108, 117, 125);
            color: rgb(255, 255, 255);
        }

        .linkedinbutton {
            background-color: rgb(10, 102, 194);
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            margin: 4px 2px;
            border-radius: 49px;
            cursor: pointer;
        }

        .linkedinbutton:hover {
            background-color: rgb(19, 82, 146);
            color: white;
        }

        .linkedin2button {
            background-color: rgb(255, 255, 255);
            border: 3px solid rgb(10, 102, 194);
            color: rgb(10, 102, 194);
            padding: 15px 32px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            margin: 4px 2px;
            border-radius: 49px;
            cursor: pointer;
        }

        .linkedin2button:hover {
            background-color: rgb(76, 159, 243);
            border: 3px solid rgb(10, 102, 194);
            color: white;
        }

    </style>
</head>

<body>

    <button class="uberbutton"> 
        Request now
    </button>

    <button class="amazonbutton">
        Add to cart
    </button>

    <button class="githubbutton">
        Sign up
    </button>

    <button class="bootstrapbutton">
        Get started
    </button>

    <button class="bootstrap2button">
        Download
    </button>

    <button class="linkedinbutton">
        Apply on company website    
    </button>

    <button class="linkedin2button">
        Save
    </button>   

</body>
</html>
